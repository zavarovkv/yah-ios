name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Validate string catalogs
        run: |
          jq empty YetAnotherHabit/Localizable.xcstrings
          jq empty YetAnotherHabit/InfoPlist.xcstrings

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
          fi

          simulator_id=$(xcrun simctl list devices available \
            | sed -nE 's/.*iPhone[^()]*\(([A-F0-9-]+)\).*/\1/p' \
            | head -n 1)
          if [ -z "$simulator_id" ]; then
            echo "No available iPhone simulator was found" >&2
            xcrun simctl list devices
            exit 1
          fi
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build and test with strict concurrency
        run: |
          set -o pipefail
          xcodebuild test \
            -project YetAnotherHabit.xcodeproj \
            -scheme YetAnotherHabit \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Test with Address Sanitizer
        run: |
          xcodebuild test \
            -project YetAnotherHabit.xcodeproj \
            -scheme YetAnotherHabit \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/yah-asan" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            -enableAddressSanitizer YES

      - name: Test with Thread Sanitizer
        run: |
          xcodebuild test \
            -project YetAnotherHabit.xcodeproj \
            -scheme YetAnotherHabit \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/yah-tsan" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            -enableThreadSanitizer YES
